[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fugu-max"
version = "0.1.0"
description = "Adaptive Online Ensemble لعقود بينانس USDⓈ-M الآجلة (بحثي)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.1", "flake8>=6.1", "black>=23.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"
filterwarnings = ["ignore::RuntimeWarning", "ignore::FutureWarning"]

[tool.black]
line-length = 100
target-version = ["py310"]
